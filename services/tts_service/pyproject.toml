[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glossa-tts-service"
version = "0.1.0"
description = "Glossa TTS Service — Silero streaming speech synthesis"
requires-python = ">=3.11"
dependencies = [
    "glossa-common",
    "fastapi[standard]>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "orjson>=3.10",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "redis[hiredis]>=5.0",
]

[project.optional-dependencies]
# CPU torch (no CUDA) — default container image
cpu = [
    "torch>=2.3",
    "torchaudio>=2.3",
]
# GPU torch (CUDA 12.1)
gpu = [
    "torch>=2.3",
    "torchaudio>=2.3",
    "nvidia-cublas-cu12",
]
# OGG/Vorbis encoding support
ogg = [
    "soundfile>=0.12",
]
# Development & test
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
