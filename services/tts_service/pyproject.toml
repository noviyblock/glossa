[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glossa-tts-service"
version = "0.1.0"
description = "Glossa TTS Service — Silero v4 speech synthesis"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.111",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "orjson>=3.10",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true
