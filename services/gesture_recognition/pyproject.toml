[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "gesture-recognition"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "orjson>=3.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "onnxruntime>=1.18",                    # CPU backend
    "tenacity>=8.3",
    "glossa-common",                         # local lib
]

[project.optional-dependencies]
openvino = ["openvino>=2024.1"]
quantize = ["onnxruntime-tools>=1.7"]
mlflow = ["mlflow>=2.13"]
gpu = ["onnxruntime-gpu>=1.18"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
