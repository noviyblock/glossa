[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glossa-cv-service"
version = "0.1.0"
description = "Computer Vision service — DWPose (YOLOX + RTMPose) + ONNX/OpenVINO gesture classifier"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.111",
    "uvicorn[standard]>=0.29",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "rtmlib",
    "redis[hiredis]>=5.0",
    "orjson>=3.10",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
openvino = ["openvino>=2024.1"]
gpu = ["onnxruntime-gpu>=1.18"]

[tool.hatch.build.targets.wheel]
bypass-selection = true
