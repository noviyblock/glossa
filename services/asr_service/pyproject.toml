[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glossa-asr-service"
version = "1.0.0"
description = "Glossa ASR Service — faster-whisper CTranslate2 speech recognition"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.111",
    "uvicorn[standard]>=0.29",
    "faster-whisper>=1.0",
    "numpy>=1.26",
    "orjson>=3.10",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true
