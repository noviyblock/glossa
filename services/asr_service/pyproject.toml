[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glossa-asr-service"
version = "1.0.0"
description = "Glossa ASR Service — faster-whisper + CTranslate2 streaming speech recognition"
requires-python = ">=3.11"
dependencies = [
    "glossa-common",
    "fastapi[standard]>=0.111",
    "uvicorn[standard]>=0.29",
    "faster-whisper>=1.0",          # CTranslate2-based Whisper
    "ctranslate2>=4.0",             # CTranslate2 runtime
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "orjson>=3.10",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "redis[asyncio]>=5.0",          # Redis session store
    "tenacity>=8.3",                # retry handling
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "torch>=2.2",                   # needed for Silero VAD GPU
]
silero = [
    "torch>=2.2",                   # Silero VAD
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --tb=short"
