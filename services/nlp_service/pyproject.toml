[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glossa-nlp-service"
version = "0.1.0"
description = "Glossa NLP Service — Qwen2 + LangGraph + Qdrant RAG"
requires-python = ">=3.11"
dependencies = [
    "glossa-common",
    "fastapi[standard]>=0.111",
    "uvicorn[standard]>=0.29",
    "transformers>=4.41",
    "accelerate>=0.30",
    "langgraph>=0.1",
    "langchain-core>=0.2",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "orjson>=3.10",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
]

[project.optional-dependencies]
quantized = ["bitsandbytes>=0.43", "scipy>=1.13"]
gpu = ["torch>=2.3", "nvidia-cublas-cu12"]
test = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-mock>=3.14"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
