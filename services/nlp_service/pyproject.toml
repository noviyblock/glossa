[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glossa-nlp-service"
version = "0.1.0"
description = "Glossa NLP Service — Qwen2-1.5B gloss-to-text translation"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.111",
    "uvicorn[standard]>=0.29",
    "transformers>=4.41",
    "accelerate>=0.30",
    "orjson>=3.10",
]

[tool.hatch.build.targets.wheel]
packages = []
