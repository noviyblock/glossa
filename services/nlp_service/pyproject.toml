[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glossa-nlp-service"
version = "0.1.0"
description = "Glossa NLP Service — Qwen2-1.5B gloss-to-text translation"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.111",
    "uvicorn[standard]>=0.29",
    "transformers>=4.41",
    "accelerate>=0.30",
    "orjson>=3.10",
    # The merged checkpoint (colab_03 merge_and_unload) still embeds a bitsandbytes
    # 4-bit quantization_config in its config.json — transformers requires bitsandbytes
    # to be importable to load it, even though the weights were meant to be merged/dequantized.
    "bitsandbytes>=0.46.1",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true
