[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glossa-api-gateway"
version = "0.1.0"
description = "Glossa API Gateway — entry point for all client requests"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.7",
    "redis[hiredis]>=5.0",
    "orjson>=3.10",
    "prometheus-client>=0.20",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true
