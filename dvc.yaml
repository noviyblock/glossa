stages:
  # ── Model downloads ────────────────────────────────────────────────────────
  download_whisper:
    cmd: >
      python -c "
      from faster_whisper import WhisperModel;
      WhisperModel('base', device='cpu', download_root='models/whisper')
      "
    params:
      - params.yaml:
          - asr.model_size
    # models/whisper tracked via `dvc add`

  download_silero_tts:
    cmd: >
      python -c "
      import torch, os;
      os.makedirs('models/silero', exist_ok=True);
      model, _ = torch.hub.load('snakers4/silero-models', 'silero_tts',
                                language='ru', speaker='v4_ru');
      torch.save(model, 'models/silero/silero_tts_ru.pt')
      "
    # models/silero tracked via `dvc add`

  # ── Data pipeline ──────────────────────────────────────────────────────────
  preprocess:
    cmd: python mlops/pipelines/preprocess.py
    deps:
      - data/raw/slovo/
      - params.yaml
      - mlops/pipelines/preprocess.py
    params:
      - params.yaml:
          - data.random_seed
          - data.train_split
          - data.val_split
          - data.test_split
          - gesture.window_size
          - gesture.num_joints
    # data/processed/ tracked via `dvc add` after running this stage locally

  # ── Gesture training ───────────────────────────────────────────────────────
  train_gesture:
    cmd: python mlops/pipelines/train_gesture.py
    deps:
      - data/processed/
      - params.yaml
      - mlops/pipelines/train_gesture.py
    params:
      - params.yaml:
          - gesture
          - data.random_seed
    # models/gesture_classifier.onnx and models/norm_stats.npz are tracked
    # via `dvc add` (pre-trained artifacts). Remove from outs to allow that.
    metrics:
      - reports/gesture_metrics.json:
          cache: false

  # ── Gesture evaluation ─────────────────────────────────────────────────────
  eval_gesture:
    cmd: python mlops/pipelines/eval_gesture.py
    deps:
      - models/gesture_classifier.onnx
      - data/processed/val/
      - mlops/pipelines/eval_gesture.py
    metrics:
      - reports/gesture_eval.json:
          cache: false

  # ── NLP training (QLoRA) ───────────────────────────────────────────────────
  train_nlp:
    cmd: python mlops/pipelines/train_nlp.py
    deps:
      - data/translations/
      - params.yaml
      - mlops/pipelines/train_nlp.py
    params:
      - params.yaml:
          - nlp
    # models/qwen2_lora/ and models/qwen2_merged_qwen2_1.5b/ tracked via `dvc add`
    metrics:
      - reports/nlp_train_metrics.json:
          cache: false

  # ── NLP evaluation ─────────────────────────────────────────────────────────
  eval_nlp:
    cmd: python mlops/pipelines/eval_nlp.py
    deps:
      - models/qwen2_merged_qwen2_1.5b/
      - data/translations/rsl_gloss_val_slovo_synth.csv
      - mlops/pipelines/eval_nlp.py
    params:
      - params.yaml:
          - nlp.max_new_tokens
    metrics:
      - reports/nlp_eval.json:
          cache: false

  # ── Architecture-justification experiments ─────────────────────────────────
  exp_00_compare_models:
    cmd: python -m experiments.00_compare_models.run --dry-run
    deps:
      - experiments/00_compare_models/run.py
      - experiments/shared/mlflow_utils.py
    metrics:
      - experiments/results/00_compare_models/results.json:
          cache: false

  exp_01_gesture_backbone:
    cmd: >
      python -m experiments.01_gesture_backbone.run
      --n-samples ${experiments.gesture.n_samples}
      --seq-len ${experiments.gesture.seq_len}
      --dry-run
    deps:
      - experiments/01_gesture_backbone/run.py
      - experiments/shared/mlflow_utils.py
    params:
      - params.yaml:
          - experiments.gesture.n_samples
          - experiments.gesture.seq_len
    metrics:
      - experiments/results/01_gesture_backbone/results.json:
          cache: false

  exp_02_sliding_window:
    cmd: >
      python -m experiments.02_sliding_window.run
      --n-samples ${experiments.gesture.n_samples}
      --dry-run
    deps:
      - experiments/02_sliding_window/run.py
      - experiments/shared/mlflow_utils.py
    params:
      - params.yaml:
          - experiments.sliding_window.window_sizes
          - experiments.sliding_window.strides
          - experiments.gesture.n_samples
    metrics:
      - experiments/results/02_sliding_window/results.json:
          cache: false

  exp_03_inference_acceleration:
    cmd: >
      python -m experiments.03_inference_acceleration.run
      --n-samples ${experiments.acceleration.n_samples}
      --dry-run
    deps:
      - experiments/03_inference_acceleration/run.py
      - experiments/shared/mlflow_utils.py
    params:
      - params.yaml:
          - experiments.acceleration.n_samples
          - experiments.gesture.seq_len
    metrics:
      - experiments/results/03_inference_acceleration/results.json:
          cache: false

  exp_04_asr_comparison:
    cmd: >
      python -m experiments.04_asr_comparison.run
      --n-samples ${experiments.asr.n_samples}
      --dry-run
    deps:
      - experiments/04_asr_comparison/run.py
      - experiments/shared/mlflow_utils.py
    params:
      - params.yaml:
          - experiments.asr.whisper_sizes
          - experiments.asr.n_samples
    metrics:
      - experiments/results/04_asr_comparison/results.json:
          cache: false

  exp_05_nlp_llm_size:
    cmd: >
      python -m experiments.05_nlp_llm_size.run
      --n-samples ${experiments.nlp.n_samples}
      --dry-run
    deps:
      - experiments/05_nlp_llm_size/run.py
      - experiments/shared/mlflow_utils.py
    params:
      - params.yaml:
          - experiments.nlp.llm_models
          - experiments.nlp.n_samples
          - experiments.nlp.max_new_tokens
    metrics:
      - experiments/results/05_nlp_llm_size/results.json:
          cache: false

  exp_06_nlp_cache:
    cmd: >
      python -m experiments.06_rag_ablation.run
      --n-samples ${experiments.rag.n_samples}
      --dry-run
    deps:
      - experiments/06_rag_ablation/run.py
      - experiments/shared/mlflow_utils.py
    params:
      - params.yaml:
          - experiments.rag.n_samples
    metrics:
      - experiments/results/06_rag_ablation/results.json:
          cache: false

  exp_07_tts_quality:
    cmd: >
      python -m experiments.07_tts_utmos.run
      --n-samples ${experiments.tts.n_samples}
      --dry-run
    deps:
      - experiments/07_tts_utmos/run.py
      - experiments/shared/mlflow_utils.py
    params:
      - params.yaml:
          - experiments.tts.n_samples
    metrics:
      - experiments/results/07_tts_utmos/results.json:
          cache: false

  exp_08_e2e_latency:
    cmd: >
      python -m experiments.08_e2e_latency.run
      --n-samples ${experiments.e2e.n_samples}
      --dry-run
    deps:
      - experiments/08_e2e_latency/run.py
      - experiments/shared/mlflow_utils.py
    params:
      - params.yaml:
          - experiments.e2e.n_samples
          - experiments.e2e.slo_ms
    metrics:
      - experiments/results/08_e2e_latency/results.json:
          cache: false

  exp_09_cross_validation:
    cmd: >
      python -m experiments.09_cross_validation.run
      --k-folds ${experiments.cross_val.k_folds}
      --dry-run
    deps:
      - experiments/09_cross_validation/run.py
      - experiments/shared/preprocessing.py
      - experiments/shared/mlflow_utils.py
    params:
      - params.yaml:
          - experiments.cross_val.k_folds
          - experiments.cross_val.epochs
          - data.random_seed
    metrics:
      - experiments/results/09_cross_validation/results.json:
          cache: false
