name: glossa

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    tag: "{{.Name}}"

x-healthcheck-defaults: &hc
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 30s

x-service-defaults: &svc
  restart: unless-stopped
  logging: *default-logging
  env_file: .env
  networks:
    - glossa-net

# ── Model volumes shared between services ───────────────────────────────────
x-model-volumes: &model-vols
  - ./models:/models:ro
  - ./data:/data:ro

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    <<: *svc
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *hc
      test: ["CMD", "redis-cli", "ping"]
    ports:
      - "6379:6379"

  # ── MLflow — SQLite backend, no external DB required ────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.1
    <<: *svc
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlartifacts/mlflow.db
      --default-artifact-root /mlartifacts
    volumes:
      - mlflow-data:/mlartifacts
    healthcheck:
      <<: *hc
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      start_period: 10s
    ports:
      - "5000:5000"

  # ── Observability ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    <<: *svc
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.3
    <<: *svc
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_UNIFIED_ALERTING_ENABLED=true
    volumes:
      - ./infra/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "3001:3000"

  # ── Application Services ────────────────────────────────────────────────────
  cv-service:
    build:
      context: services/cv_service
      dockerfile: Dockerfile
      target: production
    <<: *svc
    environment:
      # Inference backends
      ONNX_MOBILE_PATH: /models/gesture_classifier_mobile.onnx
      OV_XML_PATH: /models/stgcn_topk_int8/stgcn_topk_int8.xml
      # Keypoint extraction — rtmlib (RTMDet-nano + RTMW)
      RTMLIB_MODE: lightweight
      RTMLIB_DEVICE: cpu
      TORCH_HOME: /home/glossa/.rtmlib
      LOW_CONF_ZERO_THRESHOLD: "0.3"
      HAND_LOW_CONF_ZERO_THRESHOLD: "0.15"
      DET_INTERVAL: "5"
      TRACK_CROP_PADDING: "1.8"
      SMOOTHING_ENABLED: "true"
      SMOOTH_MINCUTOFF: "1.0"
      SMOOTH_BETA: "0.3"
      SMOOTH_DCUTOFF: "1.0"
      # Normalisation
      NORM_STATS_PATH: /models/norm_stats.npz
      CLASS_MAP_PATH: /data/idx_to_class.json
      NUM_CLASSES: "200"
      # Sliding window — model input is 64 frames (ST-GCN trained on T=64,
      # see scripts/patch_colab_03_scenario.py). WINDOW_STRIDE/EARLY_EMIT/
      # CONF_THRESHOLD are now only consumed by the unused legacy /ws
      # streaming endpoint (see main.py) — /process_frame (the live path)
      # uses GESTURE_* config below instead. Left in place as harmless dead
      # config rather than churning this file for an unrelated cleanup.
      WINDOW_SIZE: "64"
      WINDOW_STRIDE: "5"
      EARLY_EMIT: "10"
      CONF_THRESHOLD: "0.7"
      # Gesture segmentation (automatic onset/offset from hand motion,
      # replaces the manual hold-to-sign button) — tune empirically against
      # the live camera/users, see gesture_segmenter.py docstring.
      GESTURE_ONSET_THRESHOLD: "0.06"
      GESTURE_OFFSET_THRESHOLD: "0.03"
      GESTURE_ONSET_FRAMES: "3"
      GESTURE_OFFSET_FRAMES: "6"
      GESTURE_HAND_PRESENCE_CONF: "0.15"
      GESTURE_PREROLL_FRAMES: "5"
      GESTURE_MIN_FRAMES: "8"
      GESTURE_MAX_FRAMES: "150"
      # Runtime
      CV_SERVICE_PORT: "8001"
      REDIS_URL: redis://redis:6379
    volumes:
      - ./models:/models:ro
      - ./data:/data:ro
      - ./rtmlib_cache:/home/glossa/.rtmlib
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/live"]
      start_period: 90s
    ports:
      - "8001:8001"

  asr-service:
    build:
      context: services/asr_service
      dockerfile: Dockerfile
      target: production
    <<: *svc
    environment:
      ASR_SERVICE_PORT: "8002"
      ASR_WHISPER_MODEL: base
      ASR_DEVICE: cpu
      ASR_COMPUTE_TYPE: int8
      LANGUAGE: ru
      ASR_BEAM_SIZE: "5"
      ASR_VAD_FILTER: "true"
      WHISPER_CACHE_DIR: /models/whisper_cache
    volumes:
      - ./models:/models:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD", "curl", "-f", "http://localhost:8002/health/live"]
      start_period: 45s
    ports:
      - "8002:8002"
    shm_size: "512m"

  nlp-service:
    build:
      context: services/nlp_service
      dockerfile: Dockerfile
      target: production
    <<: *svc
    environment:
      NLP_SERVICE_PORT: "8003"
      NLP_DEVICE: cpu
      MODEL_PATH: /models/qwen2_merged_qwen2_1.5b
      CACHE_SIZE: "500"
      MAX_NEW_TOKENS: "128"
    volumes: *model-vols
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD", "curl", "-f", "http://localhost:8003/health/live"]
      start_period: 120s
    ports:
      - "8003:8003"
    shm_size: "2g"

  tts-service:
    build:
      context: services/tts_service
      dockerfile: Dockerfile
      target: production
    <<: *svc
    environment:
      TTS_SERVICE_PORT: "8004"
      TTS_DEVICE: cpu
      TTS_SILERO_REPO: snakers4/silero-models
      TTS_DEFAULT_SPEAKER: xenia
      TTS_SAMPLE_RATE: "24000"
      TTS_CACHE_SIZE: "200"
      TORCH_HOME: /torch_cache
    volumes:
      - ./models:/models:ro
      - torch-cache:/torch_cache
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD", "curl", "-f", "http://localhost:8004/health/live"]
      start_period: 60s
    ports:
      - "8004:8004"

  api-gateway:
    build:
      context: services/api_gateway
      dockerfile: Dockerfile
      target: production
    <<: *svc
    environment:
      GATEWAY_PORT: "8000"
      REDIS_URL: redis://redis:6379
      CV_SERVICE_URL: http://cv-service:8001
      ASR_SERVICE_URL: http://asr-service:8002
      NLP_SERVICE_URL: http://nlp-service:8003
      TTS_SERVICE_URL: http://tts-service:8004
      GATEWAY_SESSION_TTL: "300"
      GATEWAY_HTTP_TIMEOUT: "120"
      # Sentence accumulation — buffer completed gestures and translate the
      # whole sentence at once (T9-style disambiguation across positions)
      # instead of calling the LLM after every single gesture.
      SENTENCE_PAUSE_SECONDS: "2.5"
      MAX_SENTENCE_GLOSSES: "8"
    depends_on:
      redis:
        condition: service_healthy
      cv-service:
        condition: service_healthy
      asr-service:
        condition: service_healthy
      nlp-service:
        condition: service_healthy
      tts-service:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
    ports:
      - "8000:8000"

networks:
  glossa-net:
    driver: bridge

volumes:
  redis-data:
  mlflow-data:
  prometheus-data:
  grafana-data:
  torch-cache:
