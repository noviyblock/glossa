# GPU override — adds NVIDIA runtime and device reservations
name: glossa

services:
  cv-service:
    build:
      target: production-gpu
    environment:
      # RTMLIB_DEVICE is the real config knob (see cv_service/config.py) —
      # CV_DEVICE/CV_MODEL_BACKEND previously here didn't map to anything in
      # the code and silently had no effect (extraction stayed on CPU).
      # 'balanced' rtmlib mode (more accurate hand/finger localization than
      # 'lightweight') is affordable now that extraction is GPU-accelerated.
      - RTMLIB_DEVICE=cuda
      - RTMLIB_MODE=balanced
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  asr-service:
    build:
      target: production-gpu
    environment:
      - ASR_DEVICE=cuda
      - ASR_COMPUTE_TYPE=float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  nlp-service:
    build:
      target: production-gpu
    environment:
      - NLP_DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  tts-service:
    build:
      target: production-gpu
    environment:
      - TTS_DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
