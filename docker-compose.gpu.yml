# GPU override — adds NVIDIA runtime and device reservations
name: glossa

services:
  cv-service:
    build:
      target: production-gpu
    environment:
      # RTMLIB_DEVICE is the real config knob (see cv_service/config.py) —
      # CV_DEVICE/CV_MODEL_BACKEND previously here didn't map to anything in
      # the code and silently had no effect (extraction stayed on CPU).
      #
      # RTMLIB_MODE deliberately NOT overridden to 'balanced' here anymore.
      # Benchmarked 2026-07-18 (see config.py's RTMLIB_MODE comment,
      # RTMLIB_MODE_BENCHMARK.md): balanced's accuracy is statistically
      # indistinguishable from lightweight (95% CIs overlap, n=185) — the
      # "more accurate hand/finger localization" premise this override used
      # to state was never actually measured and turned out false. GPU only
      # cuts balanced's latency penalty, it doesn't fix its (non-existent)
      # accuracy advantage — no reason to switch modes just because GPU
      # makes the wrong choice cheaper. Stays on lightweight (the base
      # compose file's default) until a live-camera (not clean-clip)
      # benchmark shows an actual reason to switch.
      - RTMLIB_DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  asr-service:
    build:
      target: production-gpu
    environment:
      - ASR_DEVICE=cuda
      - ASR_COMPUTE_TYPE=float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  nlp-service:
    build:
      target: production-gpu
    environment:
      - NLP_DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  tts-service:
    build:
      target: production-gpu
    environment:
      - TTS_DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
