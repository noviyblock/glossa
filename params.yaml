# ============================================================
# Glossa MLOps — Training & Evaluation Hyperparameters
# Tracked by DVC. Any change here invalidates downstream stages.
# ============================================================

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  random_seed: 42
  train_split: 0.80
  val_split:   0.10
  test_split:  0.10
  slovo_root:         data/raw/slovo
  label_mapping_path: data/label_mapping.json
  gesture_dataset:    data/gestures
  nlp_dataset:        data/translations
  asr_dataset:        data/audio

# ── Gesture recognition ───────────────────────────────────────────────────────
gesture:
  model_architecture: stgcn
  num_classes:    200      # reduced from 1000 — see data/selected_classes_200.json
  class_filter_path: data/selected_classes_200.json
  num_joints:     75
  window_size:    32       # sliding window for inference (frames)
  sequence_length: 64      # training sequence length (EDA: median=48, Q3=58)
  stride:         15       # sliding window stride
  confidence_threshold: 0.7
  # Training
  batch_size:     32
  lr:             0.001
  learning_rate:  0.001    # alias kept for backward compat
  epochs:         200
  early_stopping_patience: 10
  weight_decay:   0.0001
  scheduler:      cosine
  # Data augmentation
  augmentation:
    flip_prob:   0.5
    scale_range: [0.8, 1.2]
    noise_std:   0.01
  # ONNX export
  export:
    opset_version: 17
    simplify:      true
    quantize_int8: false

# ── NLP translation ───────────────────────────────────────────────────────────
nlp:
  base_model:    "Qwen/Qwen2-1.5B-Instruct"
  peft_method:   lora
  lora_r:        64
  lora_alpha:    128
  lora_dropout:  0.05
  max_seq_length: 512
  total_pairs:   10000
  # Training
  batch_size:    4
  learning_rate: 2.0e-4
  epochs:        3
  warmup_ratio:  0.03
  gradient_accumulation_steps: 4
  load_in_4bit:  true
  # Inference
  max_new_tokens: 128
  temperature:   0.1

# ── ASR (Whisper) ─────────────────────────────────────────────────────────────
asr:
  model_size:   base
  compute_type: int8
  beam_size:    5
  language:     ru
  vad_filter:   true

# ── Benchmarking ──────────────────────────────────────────────────────────────
benchmark:
  n_samples:    100
  warmup_runs:  10
  batch_sizes:  [1, 4, 8]
  backends:     [onnx, onnx_int8]
  devices:      [CPU]

# ── Architecture-justification experiments ────────────────────────────────────
experiments:
  cross_val:
    k_folds:     5
    epochs:      30
    train_fracs: [0.05, 0.10, 0.25, 0.50, 0.75, 1.0]
  gesture:
    n_samples: 100
    seq_len:   32
  sliding_window:
    window_sizes: [16, 24, 32]
    strides:      [8, 15, 20]
  acceleration:
    n_samples:             200
    calibration_samples:    50
  asr:
    whisper_sizes: [tiny, base]
    n_samples:     50
  nlp:
    llm_models:
      - Qwen/Qwen2-1.5B-Instruct
    n_samples:      50
    max_new_tokens: 128
  rag:
    n_samples: 40
  tts:
    n_samples:   20
    speakers:    [xenia, eugene, aidar]
    sample_rate: 24000
  e2e:
    n_samples: 50
    slo_ms:    2000

# ── Promotion thresholds ──────────────────────────────────────────────────────
promotion:
  gesture:
    min_accuracy:       0.90
    min_f1_weighted:    0.88
    max_latency_p95_ms: 50.0
  nlp:
    min_bleu_4:         0.35
    min_rouge_l:        0.40
    max_latency_p95_ms: 500.0
  asr:
    max_wer: 0.15
