name: glossa_mobile
description: Glossa RSL Translation — mobile client
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera
  camera: ^0.10.5+9
  # WebSocket
  web_socket_channel: ^2.4.0
  # Audio recording
  record: ^5.1.2
  # Audio playback
  just_audio: ^0.9.40
  # State management
  provider: ^6.1.2
  # UUID generation
  uuid: ^4.4.0
  # Permissions
  permission_handler: ^11.3.1
  # Temp files
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
