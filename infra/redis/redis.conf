# ── Glossa Redis Configuration ────────────────────────────────────────────────
# Production-grade persistence: AOF (every second) + RDB snapshots

# Network
bind 0.0.0.0
port 6379
protected-mode yes
tcp-keepalive 300

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# ── Persistence: RDB snapshots ────────────────────────────────────────────────
save 900 1        # after 900s if at least 1 key changed
save 300 10       # after 300s if at least 10 keys changed
save 60  1000     # after 60s  if at least 1000 keys changed
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ── Persistence: AOF ──────────────────────────────────────────────────────────
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec        # fsync every second — good balance of safety vs perf
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes    # hybrid format: faster restart

# ── Slow log ──────────────────────────────────────────────────────────────────
slowlog-log-slower-than 10000   # microseconds
slowlog-max-len 128

# ── Keyspace notifications (for session TTL events) ──────────────────────────
notify-keyspace-events "Ex"     # Expired events

# ── Streams ───────────────────────────────────────────────────────────────────
stream-node-max-bytes 4096
stream-node-max-entries 100

# ── Logging ───────────────────────────────────────────────────────────────────
loglevel notice
logfile ""    # stderr → captured by Docker logging driver

# ── Security ──────────────────────────────────────────────────────────────────
# requirepass set via REDIS_PASSWORD env if needed
# rename-command FLUSHALL ""
# rename-command FLUSHDB  ""
# rename-command CONFIG   ""

# ── Performance ───────────────────────────────────────────────────────────────
hz 15
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
