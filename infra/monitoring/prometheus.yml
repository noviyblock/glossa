global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "${ENVIRONMENT:-development}"
    platform: glossa

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # Configure Alertmanager endpoint here for production

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: glossa-api-gateway
    static_configs:
      - targets: ["api-gateway:8000"]
        labels:
          service: api-gateway
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: glossa-cv-service
    static_configs:
      - targets: ["cv-service:8001"]
        labels:
          service: cv-service
    metrics_path: /metrics

  - job_name: glossa-asr-service
    static_configs:
      - targets: ["asr-service:8002"]
        labels:
          service: asr-service
    metrics_path: /metrics

  - job_name: glossa-nlp-service
    static_configs:
      - targets: ["nlp-service:8003"]
        labels:
          service: nlp-service
    metrics_path: /metrics

  - job_name: glossa-tts-service
    static_configs:
      - targets: ["tts-service:8004"]
        labels:
          service: tts-service
    metrics_path: /metrics

  - job_name: redis
    static_configs:
      - targets: ["redis:6379"]

  - job_name: mlflow
    static_configs:
      - targets: ["mlflow:5000"]
    metrics_path: /metrics
