global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "${ENVIRONMENT:-development}"
    platform: glossa

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # Configure Alertmanager endpoint here for production

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: glossa-api-gateway
    static_configs:
      - targets: ["api-gateway:8000"]
    metrics_path: /metrics
    scrape_interval: 10s
    labels:
      service: api-gateway

  - job_name: glossa-cv-service
    static_configs:
      - targets: ["cv-service:8001"]
    metrics_path: /metrics
    labels:
      service: cv-service

  - job_name: glossa-asr-service
    static_configs:
      - targets: ["asr-service:8002"]
    metrics_path: /metrics
    labels:
      service: asr-service

  - job_name: glossa-nlp-service
    static_configs:
      - targets: ["nlp-service:8003"]
    metrics_path: /metrics
    labels:
      service: nlp-service

  - job_name: glossa-tts-service
    static_configs:
      - targets: ["tts-service:8004"]
    metrics_path: /metrics
    labels:
      service: tts-service

  - job_name: glossa-max-adapter
    static_configs:
      - targets: ["max-adapter:8005"]
    metrics_path: /metrics
    labels:
      service: max-adapter

  - job_name: redis
    static_configs:
      - targets: ["redis:6379"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
    metrics_path: /metrics
