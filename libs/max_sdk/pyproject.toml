[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glossa-max-sdk"
version = "0.1.0"
description = "Glossa MAX SDK wrapper — type-safe interface for Modular MAX pipelines"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
max = ["max>=24.4"]

[tool.hatch.build.targets.wheel]
packages = ["glossa_max"]
