# Development overrides — hot-reload, debug ports, relaxed resource limits
name: glossa

services:
  api-gateway:
    build:
      target: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    volumes:
      - ./services/api_gateway:/app:cached
      - ./libs:/libs:cached
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=text

  cv-service:
    build:
      target: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload --log-level debug
    volumes:
      - ./services/cv_service:/app:cached
      - ./libs:/libs:cached
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG

  asr-service:
