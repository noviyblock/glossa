# Production overrides — resource limits, production env
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
name: glossa

x-prod-restart: &restart
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
    window: 120s

services:
  redis:
    deploy:
      <<: *restart
      resources:
        limits: { cpus: "1.0", memory: 768M }
        reservations: { cpus: "0.25", memory: 256M }

  mlflow:
    deploy:
      <<: *restart
      resources:
        limits: { cpus: "0.5", memory: 512M }

  prometheus:
    deploy:
      <<: *restart
      resources:
        limits: { cpus: "1.0", memory: 1G }

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: https://${DOMAIN:-localhost}/grafana/
    deploy:
      <<: *restart
      resources:
        limits: { cpus: "0.5", memory: 512M }

  cv-service:
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    deploy:
      <<: *restart
      resources:
        limits: { cpus: "2.0", memory: 3G }
        reservations: { cpus: "1.0", memory: 1G }

  asr-service:
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    deploy:
      <<: *restart
      resources:
        limits: { cpus: "2.0", memory: 4G }
        reservations: { cpus: "1.0", memory: 2G }

  nlp-service:
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    deploy:
      <<: *restart
      resources:
        limits: { cpus: "2.0", memory: 6G }
        reservations: { cpus: "1.0", memory: 3G }

  tts-service:
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    deploy:
      <<: *restart
      resources:
        limits: { cpus: "1.0", memory: 2G }
        reservations: { cpus: "0.5", memory: 512M }

  api-gateway:
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    deploy:
      <<: *restart
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.25", memory: 128M }
